<!DOCTYPE html>
<html>
<head>
    <title>AI Attendance</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/script.js"></script>
</head>
<body>

<div class="card">
    <h2>📞 AI Attendance</h2>

    <label>Subject</label>
    <select id="subject">
        <option value="AIML">AIML</option>
        <option value="DS">DS</option>
    </select>

    <label>Section</label>
    <select id="section">
        <option value="A">A</option>
        <option value="B">B</option>
    </select>

    <label>Roll Numbers</label>
    <textarea id="rolls"></textarea>

    <button onclick="startCalls()">Start Calls</button>

    <div id="status"></div>
</div>

<script src="script.js"></script>
</body>
</html>
